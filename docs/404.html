<html lang="en-GB">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <title>SPHNSX — PORTFOLIO</title>
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <!--
      Site fonts:
        · Meursault Variable — all display / body type (Adobe Fonts web project)
        · Sukhumvit Set — small uppercase labels (bundled with Apple OSes;
          falls back to a system sans on Windows/Linux/Android).
      Only Meursault is loaded as a web font (via Adobe Fonts); Sukhumvit Set is
      not distributed as one.
    -->
    <link rel="stylesheet" href="https://use.typekit.net/rgr4xrc.css" />
    <!--
      Stale-cache self-heal. Each build emits a new hashed bundle and drops the
      previous one, so a browser holding an older index.html (open tab, edge
      cache, Safari back/forward cache) requests a script that is now a 404 and
      renders nothing but a white page. Catch that failure once and re-fetch the
      page past the cache; the guard key keeps it from looping when the asset is
      genuinely unreachable (offline, outage).
    -->
    <script>
      (function () {
        var KEY = 'sphnsx_stale_asset_reload';
        window.addEventListener(
          'error',
          function (e) {
            var el = e.target;
            if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
            var src = el.src || el.href || '';
            if (src.indexOf('/assets/') === -1) return;
            try {
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, '1');
            } catch (_) {}
            location.replace(location.pathname + '?r=' + Date.now() + location.hash);
          },
          true
        );
        // The guard is released by index.tsx once the app has actually mounted, so a
        // genuinely missing asset fails visibly instead of reloading forever.
        window.addEventListener('load', function () {
          // Drop the cache-busting param so the URL the visitor sees stays clean.
          if (/[?&]r=\d+/.test(location.search)) {
            history.replaceState(null, '', location.pathname + location.hash);
          }
        });
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-B6bLTTJw.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DMOUtjDU.css">
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
  </body>
</html>
